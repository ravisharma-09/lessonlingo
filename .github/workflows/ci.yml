name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install lightweight development dependencies
        run: |
          python -m pip install --no-deps -e .
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run fake-only unit tests
        run: pytest -m "not gpu"
