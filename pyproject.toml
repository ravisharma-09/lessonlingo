[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonlingo"
version = "0.1.0"
description = "Offline-first translation of English lessons into Indian languages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "torch",
  "transformers==4.46.1",
  "indictranstoolkit==1.1.1",
]

[project.scripts]
lessonlingo = "lessonlingo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "gpu: requires the real light model and a CUDA-capable test laptop",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
