[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonlingo"
version = "0.1.0"
description = "Offline-first translation of English lessons into Indian languages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "huggingface-hub>=0.26,<2",
]

[project.scripts]
lessonlingo = "lessonlingo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
